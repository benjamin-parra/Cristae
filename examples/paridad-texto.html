<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cristae · Texto sobre líneas</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f8fafc; color: #0f172a;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  cristae-map { position: fixed; inset: 0; background: #e2e8f0; }
  #panel { position: fixed; top: 14px; right: 14px; z-index: 1000; width: 280px; background: #fff;
    border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row input[type=range] { flex: 1; }
  .exp { color: #475569; font-size: 11px; margin: 8px 0 0; }
</style>
</head>
<body>
<cristae-map initial-center="-33.45,-70.62" initial-zoom="11">
  <cristae-line-layer id="rutas"></cristae-line-layer>
  <cristae-line-layer id="rosa"></cristae-line-layer>
  <cristae-line-layer id="rosa-offset"></cristae-line-layer>
  <cristae-line-label-layer id="texto-rutas" bind-to="rutas" repeat="220" offset="-6"></cristae-line-label-layer>
  <cristae-line-label-layer id="texto-rosa" bind-to="rosa"></cristae-line-label-layer>
  <cristae-line-label-layer id="texto-rosa-offset" bind-to="rosa-offset" offset="-6"></cristae-line-label-layer>
</cristae-map>

<div id="panel">
  <h1>&lt;cristae-line-label-layer&gt;</h1>
  <div class="row">repeat <input type="range" id="repeat" min="0" max="400" step="20" value="220"><span id="repeat-v">220</span></div>
  <div class="row">offset <input type="range" id="offset" min="-12" max="12" step="1" value="-6"><span id="offset-v">-6</span></div>
  <div class="row">orientación
    <label><input type="radio" name="orientacion" value="auto" checked> auto</label>
    <label><input type="radio" name="orientacion" value="path"> path</label>
  </div>
  <div class="row"><label><input type="checkbox" id="visible" checked> visible</label></div>
  <div class="row"><label><input type="checkbox" id="oscuro"> fondo oscuro</label></div>
  <p class="exp">Izquierda: rosa de rumbos con offset 0. Derecha: la misma con offset −6; entre 89° y 91° el
  texto cambia de lado del trazo (D13). Arriba, una ruta sinuosa con repeat, un tramo hacia el oeste y una
  horquilla cerrada que no debe rotularse.</p>
</div>

<script type="module" src="./paridad-texto.js"></script>
</body>
</html>
